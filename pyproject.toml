[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ontology-compiler"
version = "1.0.0"
description = "Enterprise ontology compiler with multi-agent framework for semantic extraction and validation"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Jeremy LV", email = "jeremy@example.com"}
]
keywords = ["ontology", "semantic", "compiler", "multi-agent", "enterprise"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "pydantic>=2.0",
    "typing-extensions>=4.0",
    "aiofiles>=23.0",
    "httpx>=0.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0",
    "black>=23.0",
    "flake8>=6.0",
    "mypy>=1.0",
]
docs = [
    "sphinx>=5.0",
    "sphinx-rtd-theme>=1.0",
]

[project.urls]
Homepage = "https://github.com/example/ontology-compiler"
Documentation = "https://ontology-compiler.readthedocs.io"
Repository = "https://github.com/example/ontology-compiler.git"
Issues = "https://github.com/example/ontology-compiler/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["ontology_compiler*", "src*"]

[tool.black]
line-length = 100
target-version = ['py38', 'py39', 'py310', 'py311']

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
norecursedirs = ["tests/_archived", "tests/unit/_archived", "tests/integration/_archived", "tests/version/_archived", "ontology_compiler/services/archived", "__pycache__", ".pytest_cache"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]

[tool.coverage.run]
source = ["ontology_compiler", "src", "ontology_rag"]
omit = ["*/tests/*", "*/test_*", "*/archived/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "except Exception",
]
