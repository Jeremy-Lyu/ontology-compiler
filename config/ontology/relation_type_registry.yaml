version: "1.0"
name: relation_type_registry
status: active
owner: ontology_team
description: "统一关系类型注册表 - 所有关系类型的单一真源"

categories:
  structural:
    name: 结构关系
    description: "描述实体间的组成、包含、层次结构"
  realization:
    name: 实现关系
    description: "描述实体如何实现、部署、执行"
  ownership:
    name: 归属关系
    description: "描述实体的所有权、管理权"
  dependency:
    name: 依赖关系
    description: "描述实体间的依赖、使用、集成"
  traceability:
    name: 追溯关系
    description: "描述实体间的追溯、验证、满足"
  effectivity:
    name: 时效关系
    description: "描述实体的应用范围、替代"
  special:
    name: 特殊关系
    description: "特殊语义关系"
  system:
    name: 系统关系
    description: "系统间的连接、控制、监控"
  data:
    name: 数据关系
    description: "数据的治理、生成、更新、映射"
  process:
    name: 流程关系
    description: "流程的触发、步骤、生产"
  asset:
    name: 资产关系
    description: "资产的实例化、派生"
  enhancement:
    name: 增强关系
    description: "增强、优化关系"

