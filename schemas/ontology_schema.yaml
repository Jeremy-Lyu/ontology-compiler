# 本体 Schema 单一真源（W1 / 方案 A）
#
# 此文件是项目内 ontology schema 的唯一权威定义。
# - schemas/ontology_layer0_schema.json 由它驱动（保持兼容输出）
# - src/domain/schema_registry.py 加载本文件
# - 代码不再硬编码主类/子类列表
#
# 规范出处：deepseek_tools/_archive/root_files/UNIFIED_ONTOLOGY_AND_PIPELINE_SPEC.md
#                                            ONTOLOGY_SCHEMA_SPEC.md
#
# 命名约定（方案 A）：
# - Capability 子类使用 Domain/SubDomain/Actionable（不再以 L1_/L2_/L3_ 前缀）
# - 旧值 L1_Domain/L2_SubDomain/L3_Actionable 作为 legacy alias，registry 自动归一化
# - LayerType（L0..L3）保持不变，与 Capability 子类语义独立
#
# 校验流程：
# 1. LLM 提取阶段：prompt 中注入合法类型列表（_build_schema_hint_section）
# 2. 适配器阶段：FragmentToCanonicalAdapter 强制执行 SchemaRegistry 校验
# 3. Pipeline 阶段：EnrichStep._normalize_meta_classes 进行归一化和过滤
#
# 修改流程：
# 1. 修改本文件 → 2. 运行 scripts/run_regression_tests.py 验证 → 3. 提交
#
# 发现未覆盖别名：运行 scripts/discover_uncovered_aliases.py 分析历史产物

version: "1.2.0"
spec: "ontology_schema/v1"

# ==============================================================================
# 主类定义（L1 Entity Types）
# ==============================================================================
# 所有实体必须属于以下主类之一。新增主类需同步更新：
# - 子类定义（subclasses）
# - Legacy 别名映射（legacy_main_class_aliases，如需要）
# - 相关校验逻辑（schema_registry.py）
#
# 主类语义说明：
# - Capability: 能力域概念，如业务领域、子领域、可执行动作
# - System: 系统/平台，如企业平台、微服务应用、测试环境
# - Actor: 参与者/角色，如内部部门、业务职能、设备基础设施
# - Asset: 资产/资源，如产品定义、软件资产、工具资产、材料
# - Data: 数据/文档，如文档制品、规则逻辑、数据记录、表结构
# - Process: 流程，如业务流程
# - Concept: 概念，如领域概念、技术概念、业务概念、法律概念
# - BusinessScenario: 业务场景，如业务流程、系统集成、数据流
# - MappingRule: 映射规则，如数据映射、转换规则、集成规则
# - BusinessRule: 业务规则，如条件规则、约束规则、审批规则
# - ValidationRule: 验证规则，如 Schema 验证、业务验证、合规验证

main_classes:
  - Capability
  - System
  - Actor
  - Asset
  - Data
  - Process
  - Concept
  - BusinessScenario
  - MappingRule
  - BusinessRule
  - ValidationRule

# ==============================================================================
# 子类定义（按主类分组）
# ==============================================================================
# 子类是主类的细化分类。子类必须归属于某个主类。
# 新增子类需同步更新：
# - Legacy 别名映射（legacy_subclass_aliases，如需要）
# - FragmentToCanonicalAdapter 中的类型转换逻辑

subclasses:
  # Capability（能力域概念）
  # 语义：描述系统的能力范围和业务边界
  Capability:
    - Domain              # 主领域（如供应链、财务）
    - SubDomain           # 子领域（如订单管理、库存管理）
    - Actionable          # 可执行动作（如创建订单、查询库存）

  # System（系统/平台）
  # 语义：描述技术系统和运行环境
  System:
    - Enterprise_Platform # 企业级平台（如 ERP、CRM）
    - Microservice_App    # 微服务应用（如订单服务、支付服务）
    - Test_Environment    # 测试环境（如开发环境、测试环境）
    - External_Portal     # 外部门户（如客户门户、供应商门户）
    - SoftwareAsset       # 软件资产系统（如软件组件）
    - OSBSystem           # OSB 系统（Oracle Service Bus）
    - ConfigHubSystem     # ConfigHub 配置管理系统
    - SoftwarePart        # 软件部件
    - ReleaseEvent        # 发布事件系统
    - DownloadList        # 下载列表系统

  # Actor（参与者/角色）
  # 语义：描述参与业务流程的实体
  Actor:
    - Internal_Department # 内部部门（如采购部、销售部）
    - Business_Function   # 业务职能（如采购员、审批员）
    - Equipment_Infra     # 设备基础设施（如服务器、网络设备）
    - UserRole            # 用户角色（如管理员、操作员）
    - SystemUser          # 系统用户（如配置中心用户）

  # Asset（资产/资源）
  # 语义：描述企业拥有或使用的资源
  Asset:
    - Product_Definition  # 产品定义（如产品规格、产品型号）
    - Software_Asset      # 软件资产（如代码库、许可证、软件包）
    - Tooling_Asset       # 工具资产（如开发工具、测试工具）
    - Consumable_Material # 消耗材料（如原材料、零部件）
    - Vehicle_Instance    # 车辆实例（如货车、叉车）
    - Physical_Instance   # 物理实例（如仓库、设备）
    - Digital_Twin_Instance # 数字孪生实例
    - Document_Artifact   # 文档资产（如文件、文档）

  # Data（数据/文档/规则）
  # 语义：描述数据资产、文档、规则和概念
  Data:
    - Document_Artifact   # 文档制品（如合同、报告）
    - Rule_Logic          # 规则逻辑（如业务规则、校验规则）
    - Data_Record         # 数据记录（如订单记录、库存记录）
    - Table_Schema        # 表结构（如数据库表定义）
    - Domain_Concept      # 领域概念
    - Technical_Concept   # 技术概念
    - Business_Concept    # 业务概念
    - Data_Mapping        # 数据映射
    - Transform_Rule      # 转换规则
    - Integration_Rule    # 集成规则
    - Conditional_Rule    # 条件规则
    - Constraint_Rule     # 约束规则
    - Schema_Validation   # Schema验证
    - Business_Validation # 业务验证
    - Data_Object         # 数据对象
    - Domain_Object       # 领域对象
    - ReleaseData         # 发布数据
    - ReleaseEventRule    # 发布事件规则
    - VariantFilterRule   # 变体过滤规则
    - VariantExpressionRule # 变体表达式规则
    - CompatibilityRule   # 兼容性规则

  # Process（流程）
  # 语义：描述业务流程
  Process:
    - Business_Process    # 业务流程（如订单处理流程、审批流程）
    - DownloadProcess     # 下载流程
    - CIConfiguration     # CI 配置流程

  # Concept（概念）
  # 语义：描述领域概念
  Concept:
    - Domain_Concept      # 领域概念（如供应链概念）
    - Technical_Concept   # 技术概念（如微服务、API）
    - Business_Concept    # 业务概念（如订单、客户）
    - Legal_Concept       # 法律概念（如合同、合规）

  # BusinessScenario（业务场景）
  # 语义：描述具体的业务场景
  BusinessScenario:
    - Business_Process    # 业务流程场景
    - BusinessProcess     # 业务流程（无下划线变体）
    - System_Integration  # 系统集成场景
    - Data_Flow           # 数据流场景
    - User_Interaction    # 用户交互场景
    - Quality_Control     # 质量控制场景
    - Compliance          # 合规场景
    - Scenario            # 场景（通用）
    - UseCase             # 用例
    - Definition          # 定义
    - Term                # 术语
    - Glossary            # 术语表
    - LogicRule           # 逻辑规则
    - Constraint          # 约束
    - KDP_Transaction_Screen  # KDP 交易屏幕
    - Logistic_Process    # 物流流程
    - InventoryManagement # 库存管理
    - ShipmentProcessing  # 运输处理
    - DataFlow            # 数据流（无下划线变体）
    - Integration_Scenario # 集成场景
    - Organizational_Setup # 组织设置

  # MappingRule（映射规则）
  # 语义：描述数据映射和转换规则
  MappingRule:
    - Data_Mapping        # 数据映射（如字段映射）
    - Transform_Rule      # 转换规则（如格式转换）
    - Integration_Rule    # 集成规则（如接口集成）
    - Routing_Rule        # 路由规则（如消息路由）

  # BusinessRule（业务规则）
  # 语义：描述业务规则和约束
  BusinessRule:
    - Conditional_Rule    # 条件规则（如 IF-THEN）
    - Constraint_Rule     # 约束规则（如数据约束）
    - Approval_Rule       # 审批规则（如多级审批）
    - Trigger_Rule        # 触发规则（如事件触发）

  # ValidationRule（验证规则）
  # 语义：描述验证和校验规则
  ValidationRule:
    - Schema_Validation   # Schema 验证（如 JSON Schema）
    - Business_Validation # 业务验证（如业务规则校验）
    - Compliance_Validation # 合规验证（如合规检查）
    - Data_Quality_Validation # 数据质量验证

  # BusinessObject（业务对象）
  # 语义：描述业务领域中的具体对象和实体
  BusinessObject:
    - Business_Object     # 业务对象（标准）
    - Data_Object         # 数据对象
    - Domain_Object       # 领域对象

  # StorageLocation（存储位置）
  # 语义：描述物理或逻辑存储位置
  StorageLocation:
    - Storage_Location    # 存储位置（标准）
    - Warehouse_Location  # 仓库位置
    - Shelf_Location      # 货架位置
    - Bin_Location        # 货位位置

