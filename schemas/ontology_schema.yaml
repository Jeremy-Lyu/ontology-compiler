# ==============================================================================
# 关系类型分组（Relation Type Families）
# ==============================================================================
# 关系类型按家族分组管理，优先级从高到低：
# - structural: 结构关系，描述实体间的组成/层次/实现关系
# - semantic: 语义关系，描述实体间的业务语义关联
# - mapping: 映射关系，描述数据/规则的转换与映射
# - temporal: 时态关系，描述实体间的时序关系
#
# 抽取策略：结构关系优先，其次语义关系，再映射关系，最后时态关系

relation_families:
  structural:
    description: "结构关系 - 描述实体间的组成、层次、实现关系"
    priority: 1
    types:
      - contains          # A 包含 B（如领域包含子领域）
      - implements        # A 实现 B（如系统实现能力）
      - depends_on        # A 依赖 B（如服务依赖数据库）
      - has_part          # A 包含子部分 B
      - is_part_of        # A 是 B 的一部分
      - is_instance_of    # A 是 B 的实例（如具体产品是产品定义的实例）
      - deploys           # A 部署 B（如系统部署应用）

  semantic:
    description: "语义关系 - 描述实体间的业务语义关联"
    priority: 2
    types:
      - uses              # A 使用 B（如流程使用数据）
      - used_by           # A 被 B 使用（uses 的反向关系）
      - controls          # A 控制/管控 B（如系统控制流程）
      - associated_with   # A 与 B 关联（如角色与流程关联）
      - calls             # A 调用 B（如服务调用 API）
      - produces          # A 产生 B（如流程产生数据）
      - consumes          # A 消费 B（如服务消费消息）
      - manages           # A 管理 B（如部门管理资产）
      - owns              # A 拥有 B（如组织拥有资产）
      - interacts_with    # A 与 B 交互（如系统间交互）
      - governs           # A 治理 B（如能力治理流程）
      - processes         # A 处理 B（如系统处理数据）
      - provides_data_for # A 为 B 提供数据
      - enhances          # A 增强 B
      - creates           # A 创建 B（如动作创建实体）
      - results_in        # A 导致 B（如流程导致结果）
      - maintains         # A 维护 B（如团队维护系统）
      - performs          # A 执行/执行 B（如角色执行任务）
      - classifies_into   # A 分类到 B（如实体分类到类别）
      - sends             # A 发送消息给 B
      - notifies          # A 通知 B
      - informs           # A 告知 B
      - reports_to        # A 向 B 报告
      - requires          # A 需要/依赖 B
      - validates         # A 验证 B
      - verifies          # A 验证/核实 B
      - attaches          # A 附加到 B
      - links_to          # A 链接到 B
      - references        # A 引用 B

  mapping:
    description: "映射关系 - 描述数据/规则的转换与映射（L2.5专用）"
    priority: 3
    types:
      - defines           # L2 定义层定义 L1 实体 (L2-DEF → L1)
      - maps_to           # L2.5 规则层映射 L2 定义 (L25-RULE → L2-DEF)
      - transforms        # A 转换 B（如流程转换数据）
      - routes_to         # A 路由到 B（如消息路由）

  temporal:
    description: "时态关系 - 描述实体间的时序关系"
    priority: 4
    types:
      - triggers          # A 触发 B（如事件触发流程）
      - initiates         # A 启动/发起 B（如流程启动任务）
      - precedes          # A 在 B 之前（如步骤A在步骤B之前）
      - follows           # A 在 B 之后（如步骤A在步骤B之后）

