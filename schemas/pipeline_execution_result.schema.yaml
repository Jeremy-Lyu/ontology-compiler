# Pipeline Execution Result Contract
# Version: 1.0.0
# Status: ACTIVE
# Source of Truth: src/domain/models/pipeline_execution_result.py + this schema
#
# This file is the canonical contract for pipeline execution results.
# All pipeline outputs must conform to this schema.
# Breaking changes require version bump + migration notes.

contract_id: pipeline_execution_result
contract_type: schema
version: "1.0.0"
status: active

description: >
  Canonical contract for pipeline execution results.
  Describes the complete output of a pipeline run, including stage results,
  overall status, and execution metrics.

fields:
  overall_status:
    type: string
    required: true
    enum: [SUCCESS, FAILED, PARTIAL, RUNNING, PENDING]
    description: Final pipeline execution status.

  stages:
    type: list
    required: true
    item_contract: pipeline_stage_result
    description: Ordered list of stage execution results.

  run_id:
    type: string
    required: true
    description: Unique identifier for this pipeline run.

  source_path:
    type: string
    required: true
    description: Input source file or folder path.

  domain:
    type: string
    required: true
    default: AUTO
    description: Business domain context.

  entity_count:
    type: integer
    required: false
    default: 0
    description: Total number of entities extracted.

  relation_count:
    type: integer
    required: false
    default: 0
    description: Total number of relationships extracted.

  elapsed_seconds:
    type: number
    required: false
    default: 0.0
    description: Total pipeline execution time in seconds.

  errors:
    type: list
    required: false
    item_type: string
    description: Error messages encountered during execution.

  warnings:
    type: list
    required: false
    item_type: string
    description: Non-fatal warnings.

deprecation:
  deprecated_fields: []
  migration_notes: ""

sub_contracts:
  pipeline_stage_result:
    fields:
      stage:
        type: string
        required: true
        description: Stage name (preflight, extract, merge, audit, export, summarize).
      status:
        type: string
        required: true
        enum: [success, failed, skipped, degraded, pending]
      duration_ms:
        type: integer
        required: false
        default: 0
      message:
        type: string
        required: false
      warnings:
        type: list
        item_type: string
        required: false
      metrics:
        type: dict
        required: false
      error_type:
        type: string
        required: false
      action_hint:
        type: string
        required: false
